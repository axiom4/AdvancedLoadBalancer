# ==============================================================================
# Advanced Load Balancer (ADLB) - Configuration File
# ==============================================================================

# --- Ingress Network Settings ---
port = 8443
workers = 4
max_connections = 4096
timeout = 30
no_tui = false

# --- Balancing Algorithm ---
# Options:
#   * lc        - Least-Connections (default, lock-free)
#   * rr        - Round-Robin (sequential, lock-free)
#   * ip-hash   - Client IP Hash / Session Affinity (lock-free)
#   * latency   - Least-Latency / Fastest RTT (lock-free)
#   * wrr       - Smooth Weighted Round-Robin
#   * random    - Power of Two Random Choices (lock-free)
algorithm = lc

# --- SSL / TLS Offloading (HTTPS Termination) ---
ssl = true
cert = certs/server.crt
key = certs/server.key

# --- HAProxy PROXY Protocol v1 ---
proxy_protocol = false
accept_proxy = false

# --- Layer 4 Protocol Mode ---
udp = false
udp_timeout = 30
transparent = false

# --- Upstream TCP Keep-Alive Connection Pooling ---
# Reuses established, idle TCP sockets to backends (eliminates 1 RTT connect latency)
pool = true
pool_size = 16
pool_idle_timeout = 30

# --- Health Check Settings ---
# Types: tcp (Layer 4), http (Layer 7 GET), payload (TCP Send/Expect)
hc_type = tcp
hc_path = /
hc_send = PING\r\n
hc_expect = PONG
hc_interval = 2
hc_timeout = 800

# --- Upstream Backend Real Servers ---
# Syntax: backend = IP:PORT[:WEIGHT] or [IPv6]:PORT[:WEIGHT]
backend = 127.0.0.1:9001:1
backend = 127.0.0.1:9002:1
backend = 127.0.0.1:9003:1
# backend = [::1]:9004:2

